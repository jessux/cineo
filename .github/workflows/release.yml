name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publier l'APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/Cineo.apk \
            --title "Cinéo ${GITHUB_REF_NAME#v}" \
            --notes "APK Android. Installer Cineo.apk sur le téléphone ou Android TV (autoriser les sources inconnues)."
