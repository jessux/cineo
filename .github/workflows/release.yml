name: Build & Release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency: release
jobs:
  build:
    runs-on: ubuntu-latest
    environment: BUILD
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Clé de signature
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 || vars.KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then echo "::error::Ajoutez les secrets KEYSTORE_B64 et KEYSTORE_PASS (Settings > Secrets and variables > Actions)"; exit 1; fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/cineo.jks"
      - name: Compilation de l'APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/cineo.jks
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS || vars.KEYSTORE_PASS }}
          VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew assembleRelease --no-daemon
      - name: Publication de la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="1.2.${{ github.run_number }}"
          cp app/build/outputs/apk/release/app-release.apk "Cineo-$V.apk"
          sed -i "/<addon /s/version=\"[^\"]*\"/version=\"$V\"/" kodi/plugin.video.cineo/addon.xml
          (cd kodi && zip -qr "../plugin.video.cineo-$V.zip" plugin.video.cineo)
          gh release create "v$V" "Cineo-$V.apk" "plugin.video.cineo-$V.zip" --target "$GITHUB_SHA" --title "Cinéo $V" --generate-notes
      - name: Mise à jour de release/ dans le dépôt
        run: |
          V="1.2.${{ github.run_number }}"
          cp "Cineo-$V.apk" release/Cineo.apk
          cp "plugin.video.cineo-$V.zip" release/plugin.video.cineo.zip
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -- kodi
          git add release/Cineo.apk release/plugin.video.cineo.zip
          git commit -m "release : $V [skip ci]" || exit 0
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && break; sleep 5; done
